#   static code analysis (linting)
lint
    eslint --config etc/eslint.mts src/*.ts

#   code compilation/transpiling (building)
build : lint
    tsc --project etc/tsc.json

#   package as Docker container image
package [hostname=en4.*]
    tar cvf src/container/junction.tar \
        etc/stx.conf \
        etc/eslint.mts \
        etc/tsc.json \
        package.json \
        src/templates \
        src/*.ts
    cd src/container
    build () {
        name="$1"
        IMAGE_PREFIX=`egrep "ARG.*IMAGE_PREFIX" $name.dockerfile | sed -e 's;^.*=;;' | head -1`
        IMAGE_NAME=`egrep "ARG.*IMAGE_NAME" $name.dockerfile | sed -e 's;^.*=;;' | head -1`
        IMAGE_VERSION=`egrep "ARG.*IMAGE_VERSION" $name.dockerfile | sed -e 's;^.*=;;' | head -1`
        IMAGE_RELEASE=`egrep "ARG.*IMAGE_RELEASE" $name.dockerfile | sed -e 's;^.*=;;' | head -1`
        IMAGE_ALIAS=`egrep "ARG.*IMAGE_ALIAS" $name.dockerfile | sed -e 's;^.*=;;' | head -1`
        #   determine whether the image is missing or older than its Dockerfile
        IMAGE_CREATED=`docker image inspect --format '{{.Created}}' \
            $IMAGE_PREFIX$IMAGE_NAME:$IMAGE_VERSION-$IMAGE_RELEASE 2>/dev/null \
            | sed -e 's;\..*Z$;Z;' -e 's;Z$;;'`
        if [[ -z $IMAGE_CREATED ]]; then
            STALE=yes
        else
            IMAGE_MTIME=`date -j -f "%Y-%m-%dT%H:%M:%S" "$IMAGE_CREATED" +%s 2>/dev/null`
            FILE_MTIME=`stat -f %m $name.dockerfile`
            if [[ -z $IMAGE_MTIME || $FILE_MTIME -gt $IMAGE_MTIME ]]; then
                STALE=yes
            else
                STALE=no
            fi
        fi
        PLATFORM="linux/arm64,linux/amd64"
        if [[ $QUICK ]]; then
            PLATFORM="linux/amd64"
        fi
        if [[ $FORCE == yes || $STALE == yes ]]; then
            docker buildx build \
                --progress plain \
                --no-cache \
                --platform $PLATFORM \
                -t $IMAGE_PREFIX$IMAGE_NAME:$IMAGE_ALIAS \
                -t $IMAGE_PREFIX$IMAGE_NAME:$IMAGE_VERSION \
                -t $IMAGE_PREFIX$IMAGE_NAME:$IMAGE_VERSION-$IMAGE_RELEASE \
                -f $name.dockerfile . || exit $?
        fi
        docker image ls $IMAGE_PREFIX$IMAGE_NAME:$IMAGE_VERSION-$IMAGE_RELEASE
    }
    build junction-haproxy && \
    build junction-mosquitto && \
    build junction
    rm -f junction.tar

#   publish Docker container image
publish [hostname=en4.*]
    IMAGE_PREFIX=`egrep "ARG.*IMAGE_PREFIX" src/container/junction.dockerfile | sed -e 's;^.*=;;' | head -1` && \
    IMAGE_NAME=`egrep "ARG.*IMAGE_NAME" src/container/junction.dockerfile | sed -e 's;^.*=;;' | head -1` && \
    IMAGE_VERSION=`egrep "ARG.*IMAGE_VERSION" src/container/junction.dockerfile | sed -e 's;^.*=;;' | head -1` && \
    IMAGE_RELEASE=`egrep "ARG.*IMAGE_RELEASE" src/container/junction.dockerfile | sed -e 's;^.*=;;' | head -1` && \
    IMAGE_ALIAS=`egrep "ARG.*IMAGE_ALIAS" src/container/junction.dockerfile | sed -e 's;^.*=;;' | head -1` && \
    docker push $IMAGE_PREFIX$IMAGE_NAME:$IMAGE_VERSION-$IMAGE_RELEASE && \
    docker push $IMAGE_PREFIX$IMAGE_NAME:$IMAGE_VERSION && \
    docker push $IMAGE_PREFIX$IMAGE_NAME:$IMAGE_ALIAS

#   cleanup (built artifacts)
clean
    shx rm -rf dst

#   cleanup (bootstrap artifacts)
distclean : clean
    shx rm -f package-lock.json
    shx rm -rf node_modules

frontend
    node dst/junction-cli.js frontend

broker
    node dst/junction-cli.js broker

backend
    node dst/junction-cli.js backend

orchestrator
    node dst/junction-cli.js orchestrator -L debug -d tmp -p -c etc/junction-local.yaml

docker-run
    docker run \
        --rm \
        -v `pwd`:/pwd \
        --name junction \
        -p 127.0.0.1:8443:443 \
        ghcr.io/rse/junction:latest \
            -L info \
            -d /pwd/tmp \
            -p \
            -e /pwd/.env \
            -c /pwd/etc/junction-local.yaml

docker-exec
    docker exec -it \
        junction \
            bash

docker-backend
    JUNCTION_BROKER_PR_BACKEND_PASS=$(npx dotenvx get JUNCTION_BROKER_PR_BACKEND_PASS)
    node dst/junction-cli.js backend \
        -d ~/Work/vdon-call \
        --exclude .git \
        --connect "wss://service:$JUNCTION_BROKER_PR_BACKEND_PASS@127.0.0.1:8443/pr/api/server/" \
        --log-level info

